<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <!-- Definimos el degradado horizontal de 3 colores -->
    <linearGradient id="degradado" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#048ABF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D91E75" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con el degradado -->
  <rect width="100%" height="100%" fill="url(#degradado)" />
  
  <!-- Estampamos tu logo de la Universidad centrado -->
  <image href="https://github.com/AngelesBlagine/TSO-netbooks/blob/7026662d902cce969f35f1ca03664e0e7f275eca/logoUNO/UNO-LOGO.png" x="300" y="25" width="200" height="150" />
</svg>

