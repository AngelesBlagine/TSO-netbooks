<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - TSO Netbooks</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    style="
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: var(--bg-main);
      margin: 0;
    "
  >
    <div
      class="card"
      style="
        max-width: 400px;
        width: 90%;
        text-align: center;
        box-shadow: var(--shadow);
      "
    >
      <h2 style="color: var(--primary-dark); margin-bottom: 0.5rem">
        Registro de Alumno
      </h2>
      <p
        style="
          color: var(--text-muted);
          margin-bottom: 1.5rem;
          font-size: 0.9rem;
        "
      >
        Crea tu cuenta usando la clave de tu cátedra.
      </p>

      <form
        id="register-form"
        style="
          display: flex;
          flex-direction: column;
          gap: 1rem;
          text-align: left;
        "
      >
        <div>
          <label
            for="reg-email"
            style="
              font-size: 0.85rem;
              font-weight: bold;
              color: var(--text-main);
            "
            >Correo Electrónico</label
          >
          <input
            type="email"
            id="reg-email"
            required
            placeholder="tu@email.com"
            style="
              width: 100%;
              padding: 0.75rem;
              border: 1px solid var(--border);
              border-radius: 4px;
              margin-top: 4px;
              outline: none;
            "
          />
        </div>

        <div>
          <label
            for="reg-password"
            style="
              font-size: 0.85rem;
              font-weight: bold;
              color: var(--text-main);
            "
            >Contraseña</label
          >
          <input
            type="password"
            id="reg-password"
            required
            placeholder="••••••••"
            style="
              width: 100%;
              padding: 0.75rem;
              border: 1px solid var(--border);
              border-radius: 4px;
              margin-top: 4px;
              outline: none;
            "
          />
        </div>

        <div>
          <label
            for="reg-clave"
            style="
              font-size: 0.85rem;
              font-weight: bold;
              color: var(--text-main);
            "
            >Clave de Cátedra</label
          >
          <input
            type="text"
            id="reg-clave"
            required
            placeholder="Ej: TSO2026"
            style="
              width: 100%;
              padding: 0.75rem;
              border: 1px solid var(--border);
              border-radius: 4px;
              margin-top: 4px;
              outline: none;
            "
          />
        </div>

        <div
          id="reg-error-msg"
          style="
            display: none;
            color: var(--error);
            font-size: 0.85rem;
            background-color: #fde8e8;
            padding: 0.5rem;
            border-radius: 4px;
            text-align: center;
          "
        ></div>

        <button
          type="submit"
          class="btn"
          style="margin-top: 0.5rem"
          id="reg-btn-submit"
        >
          Registrarse
        </button>

        <div style="text-align: center; margin-top: 1rem">
          <a
            href="login.html"
            style="
              color: var(--primary);
              font-size: 0.85rem;
              text-decoration: none;
              font-weight: bold;
            "
            >¿Ya tienes cuenta? Inicia sesión</a
          >
        </div>
      </form>
    </div>

    <script type="module" src="auth.js"></script>
  </body>
</html>
